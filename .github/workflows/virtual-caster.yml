name: virtual-caster

# Compila VirtualCaster y genera los instaladores:
#   - Windows: instalador .exe (Inno Setup), sin firma de código.
#   - iPad:    .ipa SIN FIRMAR (no se instala directamente; ver virtual-caster/README.md).
# Con una etiqueta "virtual-caster-vX.Y.Z" además publica ambos archivos en un Release.

on:
  push:
    branches: [main]
    tags: ['virtual-caster-v*']
    paths:
      - 'virtual-caster/**'
      - '.github/workflows/virtual-caster.yml'
  pull_request:
    paths:
      - 'virtual-caster/**'
      - '.github/workflows/virtual-caster.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtual-caster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "version=${REF_NAME#virtual-caster-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: virtual-caster/windows
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pruebas del motor de audio
        run: dotnet test VirtualCaster.Core.Tests -c Release

      - name: Publicar la app (autocontenida, x64)
        run: dotnet publish VirtualCaster.App -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -o publish

      - name: Instalar Inno Setup si falta
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Compilar el instalador
        run: iscc "/DAppVersion=$env:VERSION" installer\VirtualCaster.iss

      - name: Prueba de arranque y captura de la ventana
        shell: pwsh
        run: |
          $png = Join-Path $PWD 'dist\VirtualCaster-captura.png'
          $p = Start-Process -FilePath (Join-Path $PWD 'publish\VirtualCaster.exe') -ArgumentList '--screenshot', "`"$png`"" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'La app no terminó en 90 s' }
          if (Test-Path "$png.error.txt") { Get-Content "$png.error.txt"; throw 'La app falló al dibujar la ventana' }
          if ($p.ExitCode -ne 0) { throw "La app terminó con código $($p.ExitCode)" }
          if (-not (Test-Path $png)) { throw 'La app no generó la captura' }

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualCaster-Windows-captura
          path: virtual-caster/windows/dist/*.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualCaster-Windows-Setup
          path: virtual-caster/windows/dist/*.exe
          if-no-files-found: error

  ipad:
    needs: version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: virtual-caster/ipad
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Generar el proyecto de Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar para iPad (sin firma)
        run: |
          xcodebuild -project VirtualCaster.xcodeproj -target VirtualCaster \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="$VERSION" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Comprobar que la app contiene el ejecutable
        run: |
          APP=build/Release-iphoneos/VirtualCaster.app
          ls -la "$APP"
          test -f "$APP/VirtualCaster" || { echo "::error::La app no contiene el ejecutable: los fuentes Swift no se compilaron"; exit 1; }
          test ! -e "$APP/VirtualCaster.swiftpm" || { echo "::error::Los fuentes se copiaron como recurso dentro de la app"; exit 1; }

      - name: Empaquetar .ipa sin firmar
        run: |
          mkdir -p dist/Payload
          cp -R build/Release-iphoneos/VirtualCaster.app dist/Payload/
          cd dist
          zip -qry "VirtualCaster-$VERSION-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualCaster-iPad-unsigned-ipa
          path: virtual-caster/ipad/dist/*.ipa
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, windows, ipad]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" artifacts/* \
            --title "VirtualCaster $VERSION" \
            --notes "Prototipo. El instalador de Windows no está firmado (SmartScreen mostrará una advertencia). El .ipa de iPad no está firmado y no se instala directamente."
