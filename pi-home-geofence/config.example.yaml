# Copia este fichero a config.yaml y rellena tus datos.
# Cualquier valor puede escribirse como ${VARIABLE} para leerlo del entorno.

child_name: "Mi hijo"          # nombre que aparecerá en los avisos

home:
  latitude: -33.4489           # coordenadas de tu casa (clic derecho en Google Maps → copiar)
  longitude: -70.6693
  radius_m: 100                # "en casa" = a menos de esta distancia
  hysteresis_m: 50             # se considera "fuera" solo al superar radius_m + hysteresis_m
  confirm_samples: 2           # muestras consecutivas necesarias para confirmar un cambio
  max_accuracy_m: 250          # se ignoran posiciones con peor precisión que esta (null = no filtrar)
  max_age_min: 15              # se ignoran posiciones más antiguas que esto (null = no filtrar)

google:
  cookies_file: ./cookies.txt  # cookies de TU cuenta (formato Netscape), ver README
  account_email: tu.cuenta@gmail.com
  person: "Nombre del hijo"    # nickname o nombre completo tal como lo muestra --list-people

# Solo para pruebas sin Google: comenta la sección google y usa un JSON local.
# file_provider:
#   path: ./posicion.json      # {"latitude": ..., "longitude": ..., "accuracy": 20, "timestamp": "2026-09-17T18:00:00+00:00"}

poll_interval_s: 60            # cada cuánto consultar la ubicación
state_file: ./state.json       # recuerda si estaba en casa entre reinicios (evita avisos duplicados)
log_level: INFO

notify:
  console: true                # siempre útil para ver qué pasa en el log
  on_leave: true               # avisar también cuando sale de casa
  # quiet_hours: { from: 23, to: 7 }   # no avisar entre las 23:00 y las 07:00 (hora local)

  telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}

  # email:
  #   host: smtp.gmail.com
  #   port: 587
  #   username: tu.cuenta@gmail.com
  #   password: ${SMTP_APP_PASSWORD}   # contraseña de aplicación, no la de la cuenta
  #   sender: tu.cuenta@gmail.com
  #   recipients: [tu.cuenta@gmail.com]
  #   use_starttls: true
